<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="دليل ولي الأمر للسلوك والمواظبة — أكاديمية نهضة">
<title>دليل السلوك والمواظبة — نهضة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Kufi+Arabic:wght@500;700&family=Mulish:wght@400;600;700;800&display=swap">
<style>
/* Layout: maroon identity band with the shield logo, sticky section rail, one 880px reading column of cards and reference tables; gold marks every section start. */
:root {
  --band: #812146;           /* Nahda maroon PMS 216 C — identity band, constant in both themes */
  --band-deep: #6B1426;
  --gold: #C49A26;
  --gold-soft: #E8C46A;
  --bg: #FAF6F7;
  --surface: #FFFFFF;
  --tint: #F6ECEF;
  --fg: #2A1D22;
  --muted: #6E5F65;
  --line: #E8DDE1;
  --accent: #812146;         /* maroon used for text and marks on the page ground */
  --danger: #B3261E;
  --mark: #F7E3A3;
  --font-ar-display: "Noto Kufi Arabic", "IBM Plex Sans Arabic", Tahoma, sans-serif;
  --font-ar-body: "IBM Plex Sans Arabic", Tahoma, "Segoe UI", sans-serif;
  --font-en: "Mulish", "Avenir Next", Avenir, "Segoe UI", Helvetica, Arial, sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #171013; --surface: #221820; --tint: #2E1F27; --fg: #F2EAED; --muted: #B9AAB1; --line: #3B2C34;
  --accent: #E7A3BC; --danger: #FF8A80; --gold: #D9B24A; --mark: #6B5410; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #171013; --surface: #221820; --tint: #2E1F27; --fg: #F2EAED; --muted: #B9AAB1; --line: #3B2C34;
  --accent: #E7A3BC; --danger: #FF8A80; --gold: #D9B24A; --mark: #6B5410; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ar-body); font-size: 16px; line-height: 1.75; }
html[lang="en"] body { font-family: var(--font-en); line-height: 1.6; }
h1, h2, h3 { text-wrap: balance; line-height: 1.35; margin: 0; }
html[lang="ar"] h1, html[lang="ar"] h2, html[lang="ar"] .display { font-family: var(--font-ar-display); }
strong { font-weight: 700; color: var(--accent); }
button { font: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* ---------- identity band ---------- */
.hero { background: var(--band); color: #fff; position: relative; overflow: hidden; }
.hero-inner { max-width: 1080px; margin: 0 auto; padding-inline: 20px; padding-block: 22px 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; align-items: end; }
.topline { display: flex; align-items: center; justify-content: space-between; gap: 16px; grid-column: 1 / -1; }
.logo { width: 132px; height: auto; display: block; }
.lang { display: inline-flex; border: 1px solid rgba(255,255,255,.45); border-radius: 999px; padding: 3px; gap: 2px; }
.lang button { background: transparent; color: #fff; border: 0; border-radius: 999px; padding: 6px 14px; cursor: pointer; font-weight: 600; font-size: 14px; }
.lang button[aria-pressed="true"] { background: #fff; color: var(--band); }
.hero-text { padding-block: 18px 34px; min-width: 0; }
.eyebrow { color: var(--gold-soft); font-weight: 600; font-size: 14px; letter-spacing: .02em; margin: 0 0 10px; }
html[lang="en"] .eyebrow { text-transform: uppercase; letter-spacing: .12em; font-size: 12.5px; }
.hero h1 { font-size: clamp(28px, 4.6vw, 46px); font-weight: 700; border-inline-start: 6px solid var(--gold); padding-inline-start: 16px; }
.hero .sub { color: var(--gold-soft); font-size: clamp(16px, 2vw, 19px); margin: 12px 0 18px; }
.hero .note { color: rgba(255,255,255,.86); font-size: 14.5px; max-width: 52ch; margin: 0; }
.hero .year { display: inline-block; margin-top: 18px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,.35); font-weight: 600; font-size: 14px; }
.hero-photo { align-self: end; min-width: 0; }
.hero-photo img { display: block; width: 100%; height: auto; aspect-ratio: 1126 / 749; object-fit: cover; }

/* ---------- search + rail ---------- */
.tools { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.tools-inner { max-width: 1080px; margin: 0 auto; padding-inline: 20px; padding-block: 10px; display: grid; gap: 8px; }
.search { position: relative; }
.search input { width: 100%; font: inherit; font-size: 15px; padding: 10px 14px; padding-inline-start: 40px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--fg); }
.search svg { position: absolute; inset-inline-start: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; stroke: var(--muted); fill: none; stroke-width: 2; }
.rail { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; }
.rail button { flex: none; background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 4px 12px; font-size: 13.5px; cursor: pointer; white-space: nowrap; }
.rail button.on { background: var(--band); border-color: var(--band); color: #fff; }
.search input::-webkit-search-cancel-button { cursor: pointer; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button { background: var(--surface); border: 1px solid var(--line); color: var(--fg); border-radius: 8px; padding: 3px 10px; font-size: 13px; cursor: pointer; }
.filters button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 700; box-shadow: inset 0 -2px 0 var(--gold); }
.filters .lbl { font-size: 13px; color: var(--muted); align-self: center; }
.results { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); max-height: min(60vh, 520px); overflow-y: auto; padding: 8px 10px 10px; box-shadow: 0 10px 30px rgba(40, 10, 20, .12); }
.results .head { font-size: 13.5px; color: var(--muted); padding: 4px 6px 6px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.results .grp { font-size: 12.5px; font-weight: 700; color: var(--accent); padding: 8px 6px 2px; border-top: 1px solid var(--line); margin-top: 4px; }
html[lang="en"] .results .grp { text-transform: uppercase; letter-spacing: .08em; font-size: 11.5px; }
.results ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.results li button { width: 100%; text-align: start; background: none; border: 0; padding: 7px 8px; border-radius: 8px; cursor: pointer; color: var(--fg); display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: baseline; font-size: 14.5px; line-height: 1.55; }
.results li button:hover, .results li button.act { background: var(--tint); }
.results .where { font-size: 12px; padding: 1px 8px; border-radius: 999px; font-weight: 700; white-space: nowrap; }
.results .ded { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.results .syn { display: block; font-size: 12px; color: var(--muted); }
.results .empty { padding: 8px 6px; }
.results .sugg { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 6px; }
.results .sugg button { background: var(--tint); border: 0; border-radius: 999px; padding: 3px 10px; font-size: 13px; cursor: pointer; color: var(--accent); }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
.flash { animation: flash 2.2s ease-out; }
@keyframes flash { 0%, 40% { background: var(--mark); } 100% { background: transparent; } }

/* ---------- reading column ---------- */
main { max-width: 880px; margin: 0 auto; padding-inline: 20px; padding-block: 8px 64px; }
section.sec { padding-top: 40px; scroll-margin-top: 120px; }
section.sec > h2.sec-title { font-size: clamp(22px, 3vw, 28px); color: var(--accent); display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
section.sec > h2.sec-title::before { content: ""; width: 6px; align-self: stretch; min-height: 1.3em; background: var(--gold); border-radius: 2px; }
h3.sub-title { font-size: 18px; color: var(--accent); margin: 26px 0 10px; padding-bottom: 6px; border-bottom: 2px solid var(--gold); }
p { margin: 0 0 12px; max-width: 72ch; }
p.small { font-size: 14px; color: var(--muted); }
p.center { text-align: center; margin-inline: auto; }
ul.bul { margin: 0 0 12px; padding-inline-start: 22px; display: grid; gap: 4px; }
ul.bul li::marker { color: var(--gold); }

.tbl { overflow-x: auto; margin: 6px 0 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
th { background: var(--band); color: #fff; font-weight: 600; text-align: start; padding: 9px 12px; white-space: nowrap; }
td { padding: 9px 12px; border-top: 1px solid var(--line); vertical-align: top; }
tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--tint) 45%, transparent); }
td.c { text-align: center; }
td.b { font-weight: 700; color: var(--accent); }
td.danger, span.danger { color: var(--danger); font-weight: 700; }
td.chip { font-weight: 700; text-align: center; white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }

.callout { background: var(--tint); border-top: 3px solid var(--gold); border-radius: 0 0 var(--radius) var(--radius); padding: 14px 18px; margin: 10px 0 18px; }
.callout.danger { border-top-color: var(--danger); }
.callout p:last-child { margin-bottom: 0; }
.motto { font-weight: 700; font-size: 20px; color: var(--accent); text-align: center; margin: 0; }

/* level legend */
.legend { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin: 8px 0 6px; }
.legend div { border-radius: 8px; padding: 10px 6px; text-align: center; font-weight: 700; font-size: 14px; line-height: 1.4; }
.legend small { display: block; font-weight: 500; font-size: 12.5px; }

/* flow */
.flow { display: grid; gap: 8px; margin: 10px 0 20px; }
.band-row { background: var(--band); color: #fff; font-weight: 700; text-align: center; padding: 8px 12px; border-radius: 8px; }
.band-row.mid { background: var(--band-deep); }
.steps { display: flex; flex-wrap: wrap; gap: 6px; align-items: stretch; justify-content: center; }
.step { flex: 1 1 110px; min-width: 0; background: var(--tint); border-radius: 8px; padding: 8px; text-align: center; font-size: 13px; line-height: 1.45; }
.step b { display: block; color: var(--accent); font-size: 15px; }
.step.wide { flex-basis: 170px; background: color-mix(in srgb, #E3D2AA 55%, var(--surface)); }
html[data-theme="dark"] .step.wide { background: var(--tint); }
.arrow { color: var(--gold); font-weight: 700; text-align: center; font-size: 13px; }
.final { background: var(--danger); color: #fff; border-radius: 8px; text-align: center; padding: 10px; max-width: 420px; margin: 0 auto; font-weight: 700; }
:root[data-theme="dark"] .final, :root:not([data-theme="light"]) .final { color: #fff; }
.final small { display: block; font-weight: 500; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .final { background: #8E1D17; } }
:root[data-theme="dark"] .final { background: #8E1D17; }

.poster { display: flex; justify-content: center; margin: 8px 0 16px; }
.poster img { width: min(100%, 460px); height: auto; aspect-ratio: 1024 / 1536; border-radius: 8px; border: 1px solid var(--line); }

/* degree cards */
details.deg { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin: 12px 0; overflow: hidden; scroll-margin-top: 130px; }
details.deg > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 12px 16px; flex-wrap: wrap; }
details.deg > summary::-webkit-details-marker { display: none; }
.lvl { font-weight: 700; border-radius: 999px; padding: 3px 12px; font-size: 14px; white-space: nowrap; }
.deg-meta { color: var(--muted); font-size: 14px; }
.deg-count { margin-inline-start: auto; color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 8px; }
.deg-count::after { content: "▾"; color: var(--accent); transition: transform .2s; }
details[open] .deg-count::after { transform: rotate(180deg); }
.deg-body { border-top: 1px solid var(--line); padding: 14px 16px 16px; display: grid; gap: 14px; }
.vio h4, .procs h4 { margin: 0 0 6px; font-size: 14px; color: var(--muted); font-weight: 600; }
html[lang="en"] .vio h4, html[lang="en"] .procs h4 { text-transform: uppercase; letter-spacing: .08em; font-size: 12px; }
ol.vlist { margin: 0; padding-inline-start: 24px; display: grid; gap: 3px; font-size: 15px; }
ol.vlist li::marker { color: var(--accent); font-weight: 700; }
.proc { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-top: 1px dashed var(--line); }
.proc:first-of-type { border-top: 0; }
.when { font-weight: 700; color: var(--accent); font-size: 14.5px; }
.proc ul { margin: 0; padding-inline-start: 18px; display: grid; gap: 3px; font-size: 14.5px; }
.proc ul li::marker { color: var(--gold); }
.extra { margin-top: 6px; font-weight: 700; font-size: 14px; color: var(--accent); }
.extra.t { color: var(--danger); }
.deg-note { font-size: 13.5px; color: var(--muted); margin: 0; }

/* agreement */
.form { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--surface); font-size: 14px; }
.form div { padding: 12px; border-top: 1px solid var(--line); min-height: 46px; }
.form div:nth-child(3n+2), .form div:nth-child(3n+3) { border-inline-start: 1px solid var(--line); }
.form .h { background: var(--band); color: #fff; font-weight: 600; border-top: 0; min-height: 0; }
.form .l { background: var(--tint); color: var(--accent); font-weight: 600; }

footer { background: var(--band); color: #fff; }
.foot { max-width: 1080px; margin: 0 auto; padding-inline: 20px; padding-block: 26px; display: flex; flex-wrap: wrap; gap: 18px; align-items: center; justify-content: space-between; font-size: 14px; }
.foot img { width: 96px; height: auto; }
.foot .tag { color: var(--gold-soft); font-weight: 700; }

@media (max-width: 760px) {
  .hero-inner { grid-template-columns: minmax(0, 1fr); }
  .hero-text { padding-bottom: 6px; }
  .hero-photo { margin-inline: -20px; }
  .legend { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .proc { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .form { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); font-size: 13px; }
}
@media (max-width: 760px) { .filters { flex-wrap: nowrap; overflow-x: auto; } .filters button { flex: none; } }
@media (hover: none) { .results .head span + span { display: none; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>


<header class="hero">
  <div class="hero-inner">
    <div class="topline">
      <img class="logo" id="logo" alt="Nahda Academy" width="520" height="400">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="btn-ar" lang="ar">عربي</button>
        <button type="button" id="btn-en" lang="en">English</button>
      </div>
    </div>
    <div class="hero-text">
      <p class="eyebrow" data-i="eyebrow"></p>
      <h1 data-i="title"></h1>
      <p class="sub" data-i="sub"></p>
      <p class="note" data-i="note"></p>
      <span class="year num" data-i="year"></span>
    </div>
  </div>
</header>

<div class="tools">
  <div class="tools-inner">
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <input id="q" type="search" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list">
    </div>
    <div class="filters" id="filters" role="group"></div>
    <div class="results" id="results" hidden></div>
    <nav class="rail" id="rail" aria-label="Sections"></nav>
  </div>
</div>

<main id="main"></main>

<footer>
  <div class="foot">
    <img id="logo-foot" alt="Nahda Academy" width="520" height="400">
    <div>
      <div data-i="footSchool"></div>
      <div class="tag" data-i="footTag"></div>
    </div>
  </div>
</footer>

دوث الكوارث مثل الحريق"}, {"t": "مشهد من الدفاع المدني"}], [{"t": "وفاة أحد الأقارب إلى الدرجة الثالثة"}, {"t": "شهادة الوفاة"}], [{"t": "مرافقة صحية لأحد الأقارب من الدرجة الأولى (وللإدارة تقدير الأقارب حتى الدرجة الثالثة)"}, {"t": "إشعار مرافقة"}], [{"t": "مراجعة الجهات الرسمية، أو مرافقة قريب من الدرجة الأولى إليها"}, {"t": "إشعار مراجعة"}], [{"t": "المشاركة في المسابقات المحلية والدولية"}, {"t": "مشهد المشاركة"}], [{"t": "ظروف صحية أو نفسية مزمنة تقيّمها إدارة المدرسة"}, {"t": "تقرير طبي"}]], "widths": [6706, 3200]}, {"t": "h2", "text": "متابعة الغياب المتكرر"}, {"t": "table", "header": ["أيام الغياب", "بعذر مقبول", "بدون عذر"], "rows": [[{"t": "3", "color": "6B1426", "bold": true, "center": true}, {"t": "تحويل الطالب إلى الموجه وخطة تعلم لأيام الغياب، واجتماع حضوري مع ولي الأمر."}, {"t": "تحويل الطالب إلى الموجه، واجتماع حضوري مع ولي الأمر، وتعهد خطي من الطالب وولي الأمر بالالتزام بالخطة."}], [{"t": "5", "color": "6B1426", "bold": true, "center": true}, {"t": "عند عدم الالتزام بخطة التعلم: إحالة إلى لجنة التوجيه وجلسة توعوية مع ولي الأمر."}, {"t": "استدعاء ولي الأمر، وإحالة الطالب إلى لجنة التوجيه، وتنبيه ولي الأمر بعواقب استمرار الغياب."}], [{"t": "10", "color": "6B1426", "bold": true, "center": true}, {"t": "مخاطبة الجهات المختصة عند الاشتباه بتعرض الطالب للإهمال، وإشعار إدارة التعليم."}, {"t": "مخاطبة الجهات المختصة وفق نظام حماية الطفل، وإشعار إدارة التعليم."}]], "widths": [1300, 4303, 4303]}, {"t": "p", "text": "في حال كان الغياب بدون عذر 3 أيام متصلة أو أكثر، تخاطب المدرسة الجهات المختصة وفق نظام حماية الطفل.", "bold": false, "color": "5F5F5F", "center": false, "small": true}, {"t": "p", "text": "**التأخر الصباحي** مخالفة من الدرجة الأولى تُتابَع يومياً، و**الحضور المنتظم** دون غياب بدون عذر طوال الفصل يمنح الطالب 6 درجات من السلوك المتميز.", "bold": false, "center": false, "small": true}, {"t": "h1", "text": "حقوق الطالب والتزامات المدرسة"}, {"t": "p", "text": "كل إجراء في هذا الدليل يُنفَّذ في حدود نظام حماية الطفل؛ فمصلحة الطفل الفضلى مقدَّمة في كل قرار.", "bold": false, "center": false, "small": false}, {"t": "h2", "text": "ممارسات لا تُستخدم في نهضة إطلاقاً"}, {"t": "li", "text": "الإيذاء الجسدي أو النفسي بجميع أنواعه."}, {"t": "li", "text": "التسبب في انقطاع الطالب عن التعلم؛ ولذلك لا تعتمد نهضة الإيقاف عن الدراسة."}, {"t": "li", "text": "حرمان الطالب من وجبة الإفطار في وقتها."}, {"t": "li", "text": "تكليف الطالب بنسخ الواجب عدة مرات عقاباً."}, {"t": "li", "text": "استفزاز الطالب ودفعه إلى الخطأ أو الغياب."}, {"t": "li", "text": "السخرية أو الاستهزاء بشخصية الطالب."}, {"t": "li", "text": "إقصاء الطالب خارج الصف الدراسي."}, {"t": "h2", "text": "حقوق مكفولة للطالب وأسرته"}, {"t": "table", "header": ["الحق", "التفصيل"], "rows": [[{"t": "السرية", "color": "6B1426", "bold": true, "center": false}, {"t": "تُحفظ معلومات المخالفات والإجراءات وأعذار الغياب بسرية لدى الإدارة."}], [{"t": "الشفافية", "color": "6B1426", "bold": true, "center": false}, {"t": "يحق للطالب معرفة المخالفات التي حُسمت بسببها درجاته، وللأسرة الاطلاع على الإجراءات الموثقة."}], [{"t": "التدرج والتناسب", "color": "6B1426", "bold": true, "center": false}, {"t": "يُراعى عمر الطالب وظروف وقوع المخالفة، ولا يُتجاوز سلّم الإجراءات إلا في المواضع المنصوص عليها."}], [{"t": "الفصل بين الدعم والعقاب", "color": "6B1426", "bold": true, "center": false}, {"t": "لا يشارك الموجه الطلابي في حسم الدرجات أو تنفيذ العواقب، ويقتصر دوره على الدعم ودراسة الحالة."}], [{"t": "الدمج وذوو الإعاقة", "color": "6B1426", "bold": true, "center": false}, {"t": "تُدرس مخالفاتهم في لجنة التوجيه بما يراعي احتياجاتهم."}], [{"t": "ضحايا الإيذاء", "color": "6B1426", "bold": true, "center": false}, {"t": "يُستثنى الطالب الذي يثبت تعرضه للإيذاء من أي إجراء يهدد سلامته النفسية أو الجسدية."}], [{"t": "التعويض", "color": "6B1426", "bold": true, "center": false}, {"t": "فرص تعويض درجات السلوك متاحة لكل طالب في كل المراحل."}]], "widths": [2600, 7306]}], en: [{"t": "h1", "text": "Welcome"}, {"t": "p", "text": "Dear Parents,", "bold": true, "color": "6B1426", "center": false, "small": false}, {"t": "p", "text": "At Nahda Academy, we believe outstanding behaviour is the foundation of outstanding learning. Our aim is not simply to enforce rules, but to help every student develop the values, habits and character they need to become confident, respectful and responsible young people.", "bold": false, "center": false, "small": false}, {"t": "p", "text": "This guide brings together, in one reference, Nahda's Behaviour and Attendance Policy for the 2026–2027 academic year. The policy is aligned with the Ministry of Education's Student Conduct and Attendance Regulations and with the Child Protection Law. It explains what we expect of students, how the school responds to each violation step by step, and how we work with you as partners in raising our children.", "bold": false, "center": false, "small": false}, {"t": "p", "text": "By working together, we help every student succeed.", "bold": true, "color": "6B1426", "center": false, "small": false}, {"t": "h2", "text": "Vision"}, {"t": "p", "text": "We envision a place that enables every Saudi young person to realize their full potential as a Saudi citizen and as a future leader, who is also part of a wider global community, each in their own way.", "bold": false, "center": false, "small": false}, {"t": "h2", "text": "Mission"}, {"t": "p", "text": "To develop a lifelong love of learning and a belief in limitless opportunities in our students, through empowering every young person to become a morally responsible and emotionally resilient member of society.", "bold": false, "center": false, "small": false}, {"t": "h2", "text": "Our Values"}, {"t": "table", "header": ["Value", "What it means"], "rows": [[{"t": "Passion", "bold": true, "color": "6B1426"}, {"t": "We have a deep-rooted ambition, energy and drive to ensure that all of our students receive the best education possible."}], [{"t": "Responsibility", "bold": true, "color": "6B1426"}, {"t": "We believe in developing accountability towards self and others."}], [{"t": "Integrity", "bold": true, "color": "6B1426"}, {"t": "We are honest, transparent and committed to doing the right thing."}], [{"t": "Mutual Respect", "bold": true, "color": "6B1426"}, {"t": "We foster a climate of acceptance to encourage a greater understanding of each other."}], [{"t": "Excellence", "bold": true, "color": "6B1426"}, {"t": "We strive for the highest possible personal achievements."}]], "widths": [2600, 7306]}, {"t": "h1", "text": "How to Use This Guide"}, {"t": "p", "text": "This guide is designed as a quick reference you can return to at any time. To find the procedure for a specific violation:", "bold": false, "center": false, "small": false}, {"t": "table", "header": ["Step", "What to do"], "rows": [[{"t": "1", "color": "6B1426", "bold": true, "center": true}, {"t": "Open the section for your child's stage: **Primary** (Year 2 – Year 7) or **Intermediate & Secondary** (Year 8 – Year 13)."}], [{"t": "2", "color": "6B1426", "bold": true, "center": true}, {"t": "Find the violation in the level lists (Level 1 to Level 5) to see its level and the mark deduction."}], [{"t": "3", "color": "6B1426", "bold": true, "center": true}, {"t": "Read the What the school does table for that level: the first row applies the first time, and each following row applies when the same violation is repeated."}]], "widths": [900, 9006]}, {"t": "h2", "text": "Level Colours"}, {"t": "rawtable"}, {"t": "p", "text": "Level 5 applies to the Intermediate and Secondary stages only.", "bold": false, "color": "5F5F5F", "center": false, "small": true}, {"t": "h2", "text": "Codes Used in This Guide"}, {"t": "table", "header": ["Code", "Meaning"], "rows": [[{"t": "R1 – R6", "color": "6B1426", "bold": true, "center": true}, {"t": "The teacher's classroom steps before a student is referred to the administration."}], [{"t": "S1 – S4", "color": "6B1426", "bold": true, "center": true}, {"t": "Nahda's remedial sessions."}], [{"t": "◆", "color": "831F45", "bold": true, "center": true}, {"t": "A Nahda remedial measure added to the school's procedures."}], [{"t": "Transfer Decision", "color": "B3261E", "bold": true, "center": true}, {"t": "Transfer of the student to another school, as set out in the Transfer Decision section."}], [{"t": "Deduction", "color": "6B1426", "bold": true, "center": true}, {"t": "The number of marks deducted from the Positive Behaviour mark (80 marks)."}]], "widths": [2200, 7706]}, {"t": "h1", "text": "Our Expectations and the Family's Role"}, {"t": "p", "text": "These rules apply inside school, during e-learning, on trips and activities outside school, on school buses during trips, and in the streets around the school.", "bold": false, "center": false, "small": false}, {"t": "h2", "text": "We expect every student to"}, {"t": "li", "text": "Take pride in Islamic values and national belonging, and protect the security and achievements of the nation."}, {"t": "li", "text": "Treat everyone with kindness and respect, and value cultural diversity."}, {"t": "li", "text": "Follow school rules and teachers' instructions, and show moderation in thought and conduct."}, {"t": "li", "text": "Attend every day on time, arrive at lessons punctually and prepared for learning, and wear the correct school uniform."}, {"t": "li", "text": "Care for school property and the belongings of others."}, {"t": "li", "text": "Work hard and take responsibility for their learning."}, {"t": "li", "text": "Use technology safely and responsibly, and follow the etiquette of digital communication."}, {"t": "li", "text": "Report any bullying or unsafe behaviour they experience or witness to their teacher or the Student Counsellor."}, {"t": "h2", "text": "We ask families to"}, {"t": "li", "text": "Read this guide, discuss it with their children, and sign the agreement at the end at the start of each year."}, {"t": "li", "text": "Contact the school on the day of any absence with the reason, and submit the excuse within the deadline."}, {"t": "li", "text": "Attend meetings and parent councils when invited."}, {"t": "li", "text": "Monitor their children's digital activity and e-learning platforms."}, {"t": "li", "text": "Inform the Student Counsellor or Deputy Principal of any behaviour concern, and work with the school to resolve it."}, {"t": "li", "text": "Provide school requirements and follow their children's academic progress."}, {"t": "callout", "paras": [{"t": "p", "text": "**Communication:** We use ClassDojo for daily notifications, and telephone or formal letters for recorded procedures. Please keep your contact numbers up to date with Student Affairs."}], "danger": false}, {"t": "h1", "text": "Behaviour Marks and Recovery"}, {"t": "p", "text": "Behaviour carries **100 marks** from Year 4 to Year 13. These marks count towards the term average and appear on the report card. Years 2 and 3 receive a descriptive assessment.", "bold": false, "center": false, "small": false}, {"t": "table", "header": ["Component", "Marks", "How it is earned"], "rows": [[{"t": "Positive Behaviour", "color": "6B1426", "bold": true, "center": false}, {"t": "80", "bold": true, "center": true}, {"t": "Awarded to every student at the start of each term; marks are deducted for violations."}], [{"t": "Exemplary Behaviour", "color": "6B1426", "bold": true, "center": false}, {"t": "20", "bold": true, "center": true}, {"t": "Earned through exemplary practices supported by evidence."}]], "widths": [2600, 1400, 5906]}, {"t": "h2", "text": "Exemplary Behaviour Practices"}, {"t": "table", "header": ["Practice", "Marks"], "rows": [[{"t": "Full attendance with no unexcused absence throughout the term"}, {"t": "6", "bold": true, "center": true}], [{"t": "Community service outside school, a dialogue event, an awareness campaign, presenting a success story, a programme or course"}, {"t": "6 each", "bold": true, "center": true}], [{"t": "Activities in communication, leadership, digital skills or time management"}, {"t": "4 each", "bold": true, "center": true}], [{"t": "A thank-you letter, taking part in the school broadcast, a proposal to benefit the school, cooperating with peers and teachers"}, {"t": "2 each", "bold": true, "center": true}], [{"t": "Exemplary behaviour not listed, as assessed by the Student Guidance Committee"}, {"t": "Up to 6", "bold": true, "center": true}]], "widths": [7906, 2000]}, {"t": "h2", "text": "Recovery Rules"}, {"t": "li", "text": "Students may recover deducted marks through exemplary practices during the term, and may combine more than one opportunity."}, {"t": "li", "text": "The total behaviour mark may not exceed 100."}, {"t": "li", "text": "Recovery does not cancel the other procedures for a violation; a repeated violation after recovery moves to the next procedure."}, {"t": "li", "text": "If a violation occurs in the last week of term or during final examinations, recovery opportunities extend to the end of the year."}, {"t": "li", "text": "Students have the right to know which violations caused a deduction."}, {"t": "callout", "paras": [{"t": "p", "text": "**Nahda rewards system (PRIME):** In addition to the MOE practices above, reward points in the student's behaviour tracking file count towards exemplary behaviour: **every 20 reward points = 1 exemplary behaviour mark**. Once all 20 marks are earned, extra points are kept as **reserve points** to recover deducted marks, up to a total of 100."}, {"t": "p", "text": "**Violation points:** Notes in the tracking file reduce reward points only, not the Positive Behaviour mark (80), which is deducted only for the violations in this guide."}], "danger": false}, {"t": "h1", "text": "Nahda's Graduated Approach"}, {"t": "p", "text": "Behaviour is handled in three stages: the teacher's classroom steps, then administration and Student Guidance Committee procedures according to the level of the violation together with remedial sessions, and finally a transfer decision once support has been exhausted.", "bold": false, "center": false, "small": false}, {"t": "flow"}, {"t": "h2", "text": "Stage 1: The Teacher's Classroom Steps"}, {"t": "img"}, {"t": "table", "header": ["Step", "What happens", "Purpose"], "rows": [[{"t": "R1", "color": "6B1426", "bold": true, "center": true}, {"t": "First verbal warning from the teacher and a reminder of the expected behaviour."}, {"t": "A chance to make the right choice"}], [{"t": "R2", "color": "6B1426", "bold": true, "center": true}, {"t": "Second verbal warning; the student may be asked to change seat."}, {"t": "A fresh start and better focus"}], [{"t": "R3", "color": "6B1426", "bold": true, "center": true}, {"t": "The student is moved to the front or back of the classroom."}, {"t": "Support learning and behaviour"}], [{"t": "R4", "color": "6B1426", "bold": true, "center": true}, {"t": "A behaviour note is recorded in the student's behaviour monitoring file, and the student is informed."}, {"t": "Recording in order to support"}], [{"t": "R5", "color": "6B1426", "bold": true, "center": true}, {"t": "The student is told that a message will be sent to parents via ClassDojo; it is sent after the lesson."}, {"t": "Involve the family early"}], [{"t": "R6", "color": "6B1426", "bold": true, "center": true}, {"t": "A behaviour note form is completed, and the student may be referred to the Student Counsellor after the lesson."}, {"t": "Move to Stage 2"}]], "widths": [1100, 6306, 2500]}, {"t": "callout", "paras": [{"t": "p", "text": "Students are not sent out of the classroom except for safety reasons, based on the teacher's judgement of the severity of the violation. Referral to the administration is for addressing the case and taking action, not for punishment."}, {"t": "p", "text": "Violations at **Level 3 and above** are referred to the administration immediately, without going through the classroom steps."}], "danger": false}, {"t": "h1", "text": "Remedial Sessions"}, {"t": "p", "text": "Remedial sessions are a clear educational consequence in which the student takes responsibility for their actions and repairs the harm, without missing any lesson, meal or examination. They are what makes Nahda's policy distinctive: no violation passes without consequence, and no consequence becomes harmful.", "bold": false, "center": false, "small": false}, {"t": "table", "header": ["Code", "Session", "Length and timing", "What happens", "Supervised by"], "rows": [[{"t": "S1", "color": "6B1426", "bold": true, "center": true}, {"t": "Reflection Session", "bold": true, "center": false}, {"t": "20 minutes during the activity period or at the end of the school day"}, {"t": "The student completes a Reflection Card: What happened? Who was affected? How can I put it right? What will I do next time?"}, {"t": "Duty teacher or Deputy Principal"}], [{"t": "S2", "color": "6B1426", "bold": true, "center": true}, {"t": "Repair Session", "bold": true, "center": false}, {"t": "30 minutes after school"}, {"t": "A supervised school-service task linked to the violation, such as tidying what was damaged or helping in a school facility."}, {"t": "Deputy Principal or assigned teacher"}], [{"t": "S3", "color": "6B1426", "bold": true, "center": true}, {"t": "Extended Repair Session", "bold": true, "center": false}, {"t": "60 minutes after school"}, {"t": "A school-service task, followed by a short meeting with the Student Counsellor to review the behaviour plan."}, {"t": "Deputy Principal and Student Counsellor"}], [{"t": "S4", "color": "6B1426", "bold": true, "center": true}, {"t": "Intensive Behaviour Programme", "bold": true, "center": false}, {"t": "3 to 5 weekly sessions"}, {"t": "One-to-one sessions with the Student Counsellor; the student and parent sign a Behaviour Improvement Pledge; privileges are suspended until the programme is completed."}, {"t": "Student Counsellor and Student Guidance Committee"}]], "widths": [800, 1900, 1900, 3406, 1900]}, {"t": "h2", "text": "Suspension of Privileges"}, {"t": "p", "text": "Instead of suspension from school, a student's non-academic privileges may be suspended for a period set by the Student Guidance Committee (two to four weeks), such as: school trips, extracurricular activities and teams, student leadership roles, and non-essential celebrations.", "bold": false, "center": false, "small": false}, {"t": "h2", "text": "Rules for Remedial Sessions"}, {"t": "li", "text": "Sessions are applied after parents are notified; after-school sessions (S2, S3) take place with parental consent."}, {"t": "li", "text": "Sessions never conflict with core lessons, breakfast or examinations."}, {"t": "li", "text": "Sessions involve no physical or psychological harm or ridicule, and are handled confidentially and respectfully."}, {"t": "li", "text": "Sessions carry no additional mark deduction, and are recorded in the student's file."}, {"t": "li", "text": "A student's refusal to attend is recorded and treated as a repeated violation."}, {"t": "h1", "text": "At a Glance"}, {"t": "p", "text": "A summary of what happens the first time, and where the graduated process ends if the violation is repeated. Full details follow in the next sections.", "bold": false, "center": false, "small": false}, {"t": "table", "header": ["Stage and level", "Deduction", "First time", "Final step if repeated"], "rows": [[{"t": "Primary · Level 1", "fill": "99DAEE", "color": "1F3A44", "bold": true, "center": true}, {"t": "1", "bold": false, "center": true}, {"t": "Verbal warning in class"}, {"t": "Guidance Committee + S2"}], [{"t": "Primary · Level 2", "fill": "BCBD32", "color": "2E2E0A", "bold": true, "center": true}, {"t": "2", "bold": false, "center": true}, {"t": "Referral to administration, family informed + S1"}, {"t": "Move to another class + S3"}], [{"t": "Primary · Level 3", "fill": "CF8044", "color": "FFFFFF", "bold": true, "center": true}, {"t": "3", "bold": false, "center": true}, {"t": "Parent meeting and written pledge + S2"}, {"t": "Transfer Decision", "color": "B3261E", "bold": true, "center": false}], [{"t": "Primary · Level 4", "fill": "A87571", "color": "FFFFFF", "bold": true, "center": true}, {"t": "10", "bold": false, "center": true}, {"t": "Parent meeting, pledge, case study"}, {"t": "Transfer Decision", "color": "B3261E", "bold": true, "center": false}], [{"t": "Int. & Sec. · Level 1", "fill": "99DAEE", "color": "1F3A44", "bold": true, "center": true}, {"t": "1", "bold": false, "center": true}, {"t": "Verbal warning in class"}, {"t": "Guidance Committee + S2"}], [{"t": "Int. & Sec. · Level 2", "fill": "BCBD32", "color": "2E2E0A", "bold": true, "center": true}, {"t": "2", "bold": false, "center": true}, {"t": "Referral to administration, written pledge + S1"}, {"t": "Move to another class + S3"}], [{"t": "Int. & Sec. · Level 3", "fill": "CF8044", "color": "FFFFFF", "bold": true, "center": true}, {"t": "3", "bold": false, "center": true}, {"t": "Parent meeting and written pledge + S2"}, {"t": "Transfer Decision", "color": "B3261E", "bold": true, "center": false}], [{"t": "Int. & Sec. · Level 4", "fill": "A87571", "color": "FFFFFF", "bold": true, "center": true}, {"t": "10", "bold": false, "center": true}, {"t": "Guidance Committee, transfer warning + S4"}, {"t": "Transfer Decision", "color": "B3261E", "bold": true, "center": false}], [{"t": "Int. & Sec. · Level 5", "fill": "831F45", "color": "FFFFFF", "bold": true, "center": true}, {"t": "15", "bold": false, "center": true}, {"t": "Incident report, immediate Guidance Committee + S4"}, {"t": "Transfer Decision", "color": "B3261E", "bold": true, "center": false}], [{"t": "Towards staff · Level 4", "fill": "A87571", "color": "FFFFFF", "bold": true, "center": true}, {"t": "10", "bold": false, "center": true}, {"t": "Guidance Committee, transfer warning + S4"}, {"t": "Transfer Decision", "color": "B3261E", "bold": true, "center": false}], [{"t": "Towards staff · Level 5", "fill": "831F45", "color": "FFFFFF", "bold": true, "center": true}, {"t": "15", "bold": false, "center": true}, {"t": "Incident report, immediate Guidance Committee + S4"}, {"t": "Transfer Decision", "color": "B3261E", "bold": true, "center": false}]], "widths": [2500, 1000, 3906, 2500]}, {"t": "p", "text": "When the same violation is repeated, the next procedure applies directly. When several violations occur together, the procedures for the highest level apply.", "bold": false, "color": "5F5F5F", "center": false, "small": true}, {"t": "h1", "text": "Primary Stage"}, {"t": "p", "text": "The Primary stage (Year 2 – Year 7) uses four levels of violations.", "bold": false, "center": false, "small": false}, {"t": "degree", "deg": 1, "deduction": "1 mark", "stageLabel": "Primary", "violations": ["Not wearing the correct school uniform.", "Arriving late to school.", "Not attending morning assembly while present in school.", "Arriving late to morning assembly while present in school, or misbehaving during it.", "Arriving late to lessons.", "Eating during lessons without permission.", "Sleeping in class."], "procs": [{"label": "First time", "items": ["First verbal warning from the teacher or administration, explaining the harm of the behaviour in a wise, educational manner (steps R1–R2)."]}, {"label": "Second time", "items": ["Second verbal warning at the time of the incident, and reinforcement of positive behaviour.", "Observing the student and beginning to address the causes of the behaviour (steps R3–R5)."]}, {"label": "Third time", "items": ["The violation is recorded in the behaviour log and signed by the student (R6).", "Parents are informed by telephone.", "1 mark is deducted, with recovery opportunities.", "The student is referred to the Student Counsellor for a case study."], "session": "S1 Reflection Session"}, {"label": "Fourth time", "items": ["Parents are invited and a behaviour plan is agreed, delivered by the Student Counsellor.", "1 mark is deducted, with recovery opportunities.", "The student is referred to the Student Guidance Committee to explore the causes and find solutions.", "The Student Counsellor follows up the case."], "session": "S2 Repair Session"}], "note": null}, {"t": "degree", "deg": 2, "deduction": "2 marks", "stageLabel": "Primary", "violations": ["Missing a lesson or skipping it.", "Entering or leaving the classroom without permission.", "Entering another classroom without permission.", "Causing disorder in the classroom, school or school transport.", "Fighting or taking part in a group fight.", "Making indecent gestures towards students.", "Using offensive language towards students, threatening or mocking them.", "Deliberately damaging students' belongings.", "Tampering with school equipment or buildings (computers, safety equipment, electrics, laboratories, buses, writing on walls).", "Disrespecting textbooks."], "procs": [{"label": "First time", "items": ["The student is referred to the administration, and parents are informed by telephone of the violation and the procedures.", "2 marks are deducted, with recovery opportunities.", "The student apologises to those affected and repairs or replaces what was damaged.", "The student is referred to the Student Counsellor for a case study."], "session": "S1 Reflection Session"}, {"label": "Second time", "items": ["All of the above, with a revised behaviour plan.", "Parents are invited to discuss the behaviour plan, a joint preventive programme is agreed with the family, the student signs a written pledge not to repeat the behaviour, and the parent signs to acknowledge it.", "The Student Counsellor follows up the case."], "session": "S2 Repair Session"}, {"label": "Third time", "items": ["All of the above, with a revised behaviour plan.", "The student is referred to the Student Guidance Committee.", "The student is moved to another class by decision of the Committee."], "session": "S3 Extended Repair Session + suspension of privileges"}], "note": null}, {"t": "degree", "deg": 3, "deduction": "3 marks", "stageLabel": "Primary", "violations": ["Deliberately damaging school equipment or buildings.", "Stealing from students or the school.", "Hitting another student.", "Photographing or audio-recording students.", "Leaving school without permission.", "Signing on behalf of a parent without their knowledge on correspondence with the school.", "Bringing or using dangerous materials or toys (fireworks, coloured spray cans, chemicals)."], "procs": [{"label": "First time", "items": ["Parents are invited to discuss the behaviour plan, a joint preventive programme is agreed with the family, the student signs a written pledge not to repeat the behaviour, and the parent signs to acknowledge it.", "3 marks are deducted, with recovery opportunities.", "The student apologises to those affected and repairs or replaces what was damaged.", "Prohibited items are confiscated and disposed of by the Guidance Committee, with a written record.", "The student is referred to the Student Counsellor for a case study."], "session": "S2 Repair Session"}, {"label": "Second time", "items": ["All of the above, with a revised behaviour plan.", "The student is moved to another class by decision of the Guidance Committee.", "The Student Counsellor follows up the case."], "session": "S4 Intensive Behaviour Programme + suspension of privileges"}, {"label": "Third time", "items": ["All of the above, with a revised behaviour plan."], "transfer": true}], "note": null}, {"t": "degree", "deg": 4, "deduction": "10 marks", "stageLabel": "Primary", "violations": ["Insulting or mocking any of the rites of Islam.", "Insulting the State or its symbols.", "Sexual harassment.", "Starting a fire in school.", "Possessing cigarettes of any kind.", "Smoking of any kind in school.", "Possessing a sharp instrument (such as a knife).", "Cybercrime of any kind.", "Displays, images or symbols indicating sexual deviance, or promoting it.", "Bullying of any kind. See How We Handle Bullying.", "Possessing or displaying prohibited printed, audio or visual media."], "procs": [{"label": "When it occurs", "items": ["Parents are invited and the consequences are explained; a behaviour plan and joint preventive programme are agreed; the student signs a written pledge and the parent signs to acknowledge it.", "10 marks are deducted, with recovery opportunities.", "The student apologises to those affected.", "The student is referred to the Student Counsellor for a case study."], "transfer": true}], "note": "Level 4 violations at the Primary stage have a single procedure, applied the first time. In bullying cases, the procedure applies without the transfer decision for confirmed bullying; the transfer decision applies only to serious bullying (see How We Handle Bullying)."}, {"t": "h1", "text": "Intermediate & Secondary Stages"}, {"t": "p", "text": "The Intermediate and Secondary stages (Year 8 – Year 13) use five levels of violations, with higher deductions and additional serious violations at Levels 4 and 5.", "bold": false, "center": false, "small": false}, {"t": "degree", "deg": 1, "deduction": "1 mark", "stageLabel": "Intermediate & Secondary", "violations": ["Arriving late to school.", "Not attending morning assembly while present in school.", "Arriving late to morning assembly while present in school, or misbehaving during it.", "Arriving late to lessons.", "Disrupting lessons, such as side conversations, persistent pointless interruptions, or eating during the lesson.", "Sleeping in class."], "procs": [{"label": "First time", "items": ["First verbal warning from the teacher or administration, explaining the harm of the behaviour in a wise, educational manner (steps R1–R2)."]}, {"label": "Second time", "items": ["Second verbal warning at the time of the incident, and reinforcement of positive behaviour.", "Observing the student and beginning to address the causes of the behaviour (steps R3–R5)."]}, {"label": "Third time", "items": ["The violation is recorded in the behaviour log and signed by the student (R6).", "Parents are informed by telephone and the school coordinates with them to address the behaviour.", "1 mark is deducted, with recovery opportunities.", "The student is referred to the Student Counsellor for a case study."], "session": "S1 Reflection Session"}, {"label": "Fourth time", "items": ["Parents are invited and a behaviour plan is agreed, delivered by the Student Counsellor.", "1 mark is deducted, with recovery opportunities.", "The student is referred to the Student Guidance Committee to explore the causes and find solutions.", "The Student Counsellor follows up the case."], "session": "S2 Repair Session"}], "note": null}, {"t": "degree", "deg": 2, "deduction": "2 marks", "stageLabel": "Intermediate & Secondary", "violations": ["Missing a lesson or skipping it.", "Entering or leaving the classroom without permission.", "Entering another classroom without permission.", "Causing disorder in the classroom, school or school transport."], "procs": [{"label": "First time", "items": ["The student is referred to the administration, and parents are informed by telephone of the violation and the procedures.", "2 marks are deducted, with recovery opportunities.", "The student signs a written pledge not to repeat the violation.", "The student is referred to the Student Counsellor for a case study."], "session": "S1 Reflection Session"}, {"label": "Second time", "items": ["All of the above.", "Parents are invited in person to discuss the behaviour plan, a joint preventive programme is agreed, and the parent signs to acknowledge it.", "The Student Counsellor follows up the case."], "session": "S2 Repair Session"}, {"label": "Third time", "items": ["All of the above.", "The student is moved to another class by decision of the Guidance Committee.", "The student is referred to the Student Guidance Committee to agree suitable solutions."], "session": "S3 Extended Repair Session + suspension of privileges"}], "note": null}, {"t": "degree", "deg": 3, "deduction": "3 marks", "stageLabel": "Intermediate & Secondary", "violations": ["Not wearing the correct schoo  hitting with the hand or with blunt objects causing injury (a wound, bleeding or fracture).", "Stealing from students or the school.", "Photographing or audio-recording students.", "Deliberately damaging school equipment or buildings.", "Smoking of any kind in school.", "Leaving school without permission.", "Bringing or using dangerous materials or toys (fireworks, coloured spray cans, chemicals).", "Displaying or distributing prohibited printed, audio or visual media."], "procs": [{"label": "First time", "items": ["Immediate referral to the Student Guidance Committee.", "Parents are invited and the procedures explained; a behaviour plan and joint preventive programme are agreed; the student signs a written pledge and **is warned of transfer to another school if the violation is repeated**; the parent signs to acknowledge it.", "10 marks are deducted, with recovery opportunities.", "The student apologises to those affected and repairs or replaces what was damaged.", "Prohibited items are confiscated and disposed of, with a written record.", "The student is moved to another class by decision of the Guidance Committee.", "The Student Counsellor follows up the case."], "session": "S4 Intensive Behaviour Programme + suspension of privileges"}, {"label": "Second time", "items": ["All procedures from the first time, except moving to another class."], "transfer": true}], "note": null}, {"t": "degree", "deg": 5, "deduction": "15 marks", "stageLabel": "Intermediate & Secondary", "violations": ["Insulting or mocking any of the rites of Islam.", "Insulting the State or its symbols.", "Spreading or promoting extremist, takfiri or atheistic ideas, or ideas offensive to the political and social order.", "Insulting the revealed religions, or stirring up racism or tribal, sectarian or doctrinal strife.", "Forgery, or unlawful use of official documents or stamps.", "Sexual harassment.", "Displays, images or symbols indicating sexual deviance, or promoting it.", "Starting a fire in  those affected.", "The student is moved to another class by decision of the Guidance Committee and referred to the Student Counsellor."], "session": "S4 Intensive Behaviour Programme + suspension of privileges"}, {"label": "Second time", "items": ["All procedures from the first time, except moving to another class."], "transfer": true}], "note": null}, {"t": "degree", "deg": 5, "deduction": "15 marks", "stageLabel": "All stages", "violations": ["Damaging or stealing the belongings of teachers, administrators or other staff.", "Making indecent gestures towards them.", "Physically assaulting them.", "Blackmailing them.", "Cybercrime against them."], "procs": [{"label": "First time", "items": ["The administration writes an incident report.", "Parents are invited and informed of the violation and its consequences.", "15 marks are deducted, with recovery opportunities.", "The Student Guidance Committee meets immediately to study the circumstances.", "The student repairs or replaces what was damaged.", "The student apologises to those affected."], "session": "S4 Intensive Behaviour Programme + suspension of privileges"}, {"label": "Second time", "items": ["All procedures from the first time."], "transfer": true}], "note": "The affected member of staff may pursue their personal rights with the relevant authorities; waiving them does not exempt the student from the school's procedures."}, {"t": "h1", "text": "How We Handle Bullying"}, {"t": "p", "text": "At Nahda Academy, bullying is never acceptable. At the same time, we make sure no student is labelled a bully without careful checking.", "bold": false, "center": false, "small": false}, {"t": "h2", "text": "What is bullying?"}, {"t": "p", "text": "Bullying is when a particular student is targeted repeatedly, by words, actions, exclusion, or through devices and social media, in a way that causes them clear harm. We follow the Ministry of Education's definition.", "bold": false, "center": false, "small": false}, {"t": "p", "text": "We treat behaviour as bullying when the answer is yes to three questions:", "bold": false, "center": false, "small": false}, {"t": "li", "text": "Is a particular student being targeted on purpose?"}, {"t": "li", "text": "Is it happening repeatedly?"}, {"t": "li", "text": "Has it caused clear emotional or physical harm?"}, {"t": "p", "text": "**What is not bullying:** a fight between equals, mutual joking, or a one-off incident. We still deal with these, under their own violation in this guide.", "bold": false, "center": false, "small": false}, {"t": "h2", "text": "How does the school handle a case?"}, {"t": "table", "header": ["Stage", "When", "What happens"], "rows": [[{"t": "1. We watch and guide", "color": "6B1426", "bold": true, "center": false}, {"t": "Worrying behaviour that does not meet all three questions"}, {"t": "Handled under the relevant violation in this guide; the Student Counsellor follows up with both students"}], [{"t": "2. Confirmed bullying", "color": "6B1426", "bold": true, "center": false}, {"t": "The Student Guidance Committee confirms all three questions are met"}, {"t": "Bullying procedures apply without transfer (Level 4 in Primary, Level 5 in Intermediate and Secondary): a parent meeting, marks deducted and a behaviour plan with the Student Counsellor"}], [{"t": "3. Serious bullying", "color": "6B1426", "bold": true, "center": false}, {"t": "Confirmed bullying with an aggravating factor, such as repetition after action, filming or posting, group bullying or physical harm"}, {"t": "Stage 2 procedures, and it may lead to a decision to transfer the student"}]], "widths": [2200, 3853, 3853]}, {"t": "p", "text": "A student who films, posts or encourages the bullying is treated as a bully.", "bold": false, "center": false, "small": false}, {"t": "h2", "text": "What should you do if you think your child is being bullied in school?"}, {"t": "li", "text": "Contact the Student Counsellor directly."}, {"t": "li", "text": "Keep any evidence, such as screenshots and messages."}, {"t": "li", "text": "Do not contact the other student or their family yourself; leave it to the school."}, {"t": "li", "text": "Reassure your child that reporting is brave, not telling tales."}, {"t": "h2", "text": "Our commitment to you"}, {"t": "li", "text": "We support the targeted student until they feel safe again, and never bring them together with the other student unless they wish and you agree."}, {"t": "li", "text": "We keep reporters confidential and reward students who stand up for others through our PRIME system."}, {"t": "li", "text": "We help the student who bullied to change; our aim is to put things right, not only to punish."}, {"t": "h1", "text": "Digital Conduct and Remote Learning"}, {"t": "p", "text": "Behaviour on learning platforms and in remote learning is treated in the same way as behaviour in school, and the remedial session for the same level applies in person or remotely.", "bold": false, "center": false, "small": false}, {"t": "h2", "text": "Basic Etiquette"}, {"t": "li", "text": "Use only official, approved channels to contact teachers and the administration, and never share usernames or passwords."}, {"t": "li", "text": "Join on time, keep the microphone and camera off unless the teacher allows otherwise, and dress appropriately when the camera is on."}, {"t": "li", "text": "Never record, photograph or share lessons, and never share personal data."}, {"t": "li", "text": "Submit your own work and tests, respect intellectual property, and beware of unknown links."}, {"t": "h2", "text": "Primary — E-learning"}, {"t": "table", "header": ["Level", "Violations", "Procedures in brief"], "rows": [[{"t": "Level 1 · Deduction 1", "fill": "99DAEE", "color": "1F3A44", "bold": true, "center": true}, {"t": "Arriving late to a virtual lesson · repeatedly leaving it without an excuse · disrupting it by typing in the chat or interrupting"}, {"t": "Four procedures as in school: two warnings, then recording, deducti ommittee"}], [{"t": "Level 3 · Deduction 3", "fill": "CF8044", "color": "FFFFFF", "bold": true, "center": true}, {"t": "Inappropriate images in the student's profile · offensive language, threats or mockery · recording or sharing virtual lessons · misusing login details"}, {"t": "Two procedures: plan, pledge, deduction and apology; then the Guidance Committee"}], [{"t": "Level 4 · Deduction 10", "fill": "A87571", "color": "FFFFFF", "bold": true, "center": true}, {"t": "Sending indecent text, images or videos to teachers or peers · photographing or recording teachers or students"}, {"t": "Two procedures: plan, pledge, deduction and apology; then the Guidance Committee with a revised plan"}], [{"t": "Level 5 · Deduction 15", "fill": "831F45", "color": "FFFFFF", "bold": true, "center": true}, {"t": "Insulting the rites of Islam or the State · spreading extremist ideas · stirring up racism or strife · blackmailing students · cyberbullying · online harassment · displays of sexual deviance · promoting drugs · cybercrime"}, {"t": "One procedure: incident report, parents informed, deduction, Guidance Committee meeting, Counsellor follow-up"}]], "widths": [1900, 4906, 3100]}, {"t": "p", "text": "Digital violations against members of the Nahda community outside official platforms (such as messaging groups) are dealt with according to their impact in school.", "bold": false, "color": "5F5F5F", "center": false, "small": true}, {"t": "h1", "text": "Transfer Decision and Safeguarding"}, {"t": "h2", "text": "Nahda's Transfer Decision"}, {"t": "callout", "paras": [{"t": "p", "text": "The school administration issues a decision to transfer the student to another school, **with the student continuing to study remotely until the transfer is complete**. If the parent does not agree, the school administration formally submits the minutes of the school's Student Guidance Committee meeting to the Education Department, which then carries out the transfer."}], "danger": true}, {"t": "p", "t follow the graduated steps. They are handled immediately and in strict confidence:", "bold": false, "center": false, "small": false}, {"t": "li", "text": "The Principal is informed immediately; the student is treated calmly and not left alone."}, {"t": "li", "text": "The Guidance Committee meets urgently to assess the case and put a protection plan in place, with ongoing emotional support from the Student Counsellor."}, {"t": "li", "text": "The family is contacted, with the student's best interests always taken into account."}, {"t": "li", "text": "The relevant authorities are contacted when the Child Protection Law requires it (Domestic Violence Reporting Centre: 1919)."}, {"t": "h2", "text": "Nahda's Safeguarding Team"}, {"t": "table", "header": ["Role", "Early Years", "Primary", "Secondary"], "rows": [[{"t": "Designated Safeguarding Lead (DSL)", "color": "6B1426", "bold": true, "center": false}, {"t": "Ms Hanin", "center": true}, {"t": "Ms Lesley", "center": true}, {"t": "Mr James", "center": true}], [{"t": "Deputy Designated Safeguarding Leads (DDSL)", "color": "6B1426", "bold": true, "center": false}, {"t": "Ms Nuha", "center": true}, {"t": "Ms Tima", "center": true}, {"t": "Mr Bandar · Ms Reem", "center": true}]], "widths": [3600, 2100, 2100, 2100]}, {"t": "p", "text": "If you have any concern about a student's safety, please contact a member of the team directly.", "bold": false, "center": false, "small": false}, {"t": "h1", "text": "Attendance and Absence"}, {"t": "p", "text": "Attendance carries **100 marks**; 1 mark is deducted for each day of unexcused absence. Unexcused absence above **10%** of the school year prevents the student from progressing.", "bold": false, "center": false, "small": false}, {"t": "table", "header": ["Rule", "Details"], "rows": [[{"t": "Assessment", "color": "6B1426", "bold": true, "center": false}, {"t": "Descriptive assessment for Years 2 and 3; 100 marks from Year 4 to Year 13."}], [{"t": "Non-progression", "color": "6B1426", " l to the Student Counsellor, an in-person meeting with parents, and a written pledge from the student and parent to follow the plan."}], [{"t": "5", "color": "6B1426", "bold": true, "center": true}, {"t": "If the learning plan is not followed: referral to the Guidance Committee and an awareness session with parents."}, {"t": "Parents are called in, the student is referred to the Guidance Committee, and parents are warned of the consequences of continued absence."}], [{"t": "10", "color": "6B1426", "bold": true, "center": true}, {"t": "The relevant authorities are contacted if neglect is suspected, and the Education Department is informed."}, {"t": "The relevant authorities are contacted under the Child Protection Law, and the Education Department is informed."}]], "widths": [1300, 4303, 4303]}, {"t": "p", "text": "If unexcused absence reaches 3 or more consecutive days, the school contacts the relevant authorities under the Child Protection Law.", "bold": false, "color": "5F5F5F", "center": false, "small": true}, {"t": "p", "text": "**Lateness** in the morning is a Level 1 violation followed up daily, and **full attendance** with no unexcused absence throughout the term earns 6 exemplary behaviour marks.", "bold": false, "center": false, "small": true}, {"t": "h1", "text": "Student Rights and School Commitments"}, {"t": "p", "text": "Every procedure in this guide is carried out within the Child Protection Law; the child's best interests come first in every decision.", "bold": false, "center": false, "small": false}, {"t": "h2", "text": "Practices Never Used at Nahda"}, {"t": "li", "text": "Physical or psychological harm of any kind."}, {"t": "li", "text": "Causing a student to miss learning; for this reason Nahda does not use suspension from school."}, {"t": "li", "text": "Denying a student breakfast at its scheduled time."}, {"t": "li", "text": "Making a student copy homework repeatedly as a punishment."}, {"t": "li", "text": "Provoking a student into misbehaving or being absent."}, {"t": "li", "text": "Mocking or ridiculing a student's personality."}, {"t": "li", "text": "Excluding a student from the classroom."}, {"t": "h2", "text": "Rights Guaranteed to Students and Families"}, {"t": "table", "header": ["Right", "Details"], "rows": [[{"t": "Confidentiality", "color": "6B1426", "bold": true, "center": false}, {"t": "Information about violations, procedures and absence excuses is kept confidential by the administration."}], [{"t": "Transparency", "color": "6B1426", "bold": true, "center": false}, {"t": "Students have the right to know which violations led to a deduction, and families may view recorded procedures."}], [{"t": "Proportionality", "color": "6B1426", "bold": true, "center": false}, {"t": "The student's age and the circumstances of the violation are considered, and the graduated steps are not skipped except where stated."}], [{"t": "Support kept separate from sanctions", "color": "6B1426", "bold": true, "center": false}, {"t": "The Student Counsellor does not take part in deducting marks or applying consequences; their role is limited to support and case study."}], [{"t": "Inclusion and disability", "color": "6B1426", "bold": true, "center": false}, {"t": "Their violations are reviewed by the Guidance Committee with their needs taken into account."}], [{"t": "Victims of abuse", "color": "6B1426", "bold": true, "center": false}, {"t": "A student shown to have been abused is exempt from any procedure that threatens their psychological or physical safety."}], [{"t": "Recovery", "color": "6B1426", "bold": true, "center": false}, {"t": "Opportunities to recover behaviour marks are available to every student at every stage."}]], "widths": [2800, 7106]}] };

const DEG = { 1: ["#99DAEE", "#1F3A44"], 2: ["#BCBD32", "#2E2E0A"], 3: ["#CF8044", "#FFFFFF"], 4: ["#A87571", "#FFFFFF"], 5: ["#831F45", "#FFFFFF"] };
const DEDUCT = [0, 1, 2, 3, 10, 15];
const DARK_FILL_TEXT = { "B3261E": "danger", "6B1426": "accent", "831F45": "accent" };

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const md = (s) => esc(s).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/(Year \d+ – Year \d+|[RS]\d(?:\s?[–-]\s?[RS]\d)?)/g, '<bdi dir="ltr">$1</bdi>').replace(/\n/g, "<br>");
let lang = "ar";
let IDX = []; // search index: one entry per violation

function cellHtml(c) {
  const cls = [];
  let style = "";
  if (c.fill) { const f = "#" + c.fill; style = `background:${f};color:#${c.color || "222"};`; cls.push("chip"); }
  else {
    if (c.color === "B3261E") cls.push("danger");
    else if (c.bold) cls.push("b");
    if (c.center) cls.push("c");
  }
  if (/^[\d\s–-]+$/.test(String(c.t))) cls.push("num");
  return `<td class="${cls.join(" ")}" style="${style}">${md(c.t)}</td>`;
}

function render() {
  const L = UI[lang], blocks = DATA[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.title = L.title;
  document.querySelectorAll("[data-i]").forEach((el) => { el.textContent = L[el.dataset.i]; });
  document.getElementById("q").placeholder = L.search;
  document.getElementById("btn-ar").setAttribute("aria-pressed", lang === "ar");
  document.getElementById("btn-en").setAttribute("aria-pressed", lang === "en");

  let html = "", secN = 0, open = false, list = null, degN = 0, eTab = 0;
  IDX = [];
  const closeList = () => { if (list) { html += "</ul>"; list = null; } };
  const titles = [];
  for (const b of blocks) {
    if (b.t !== "li") closeList();
    switch (b.t) {
      case "h1":
        if (open) html += "</section>";
        secN++; titles.push(b.text);
        html += `<section class="sec" id="sec-${secN}"><h2 class="sec-title">${md(b.text)}</h2>`; open = true; break;
      case "h2": html += `<h3 class="sub-title">${md(b.text)}</h3>`; break;
      case "p": html += `<p class="${b.small ? "small" : ""} ${b.center ? "center" : ""}">${md(b.text)}</p>`; break;
      case "li": if (!list) { html += '<ul class="bul">'; list = true; } html += `<li>${md(b.text)}</li>`; break;
      case "table": {
        const isE = b.header.length === 3 && (b.header[1] === "المخالفات" || b.header[1] === "Violations");
        if (isE) eTab++;
        html += `<div class="tbl"><table><thead><tr>${b.header.map((h) => `<th>${md(h)}</th>`).join("")}</tr></thead><tbody>` +
          b.rows.map((r, ri) => {
            let idAttr = "";
            if (isE) {
              const id = `e${eTab}-${ri}`, deg = degFromFill(r[0].fill);
              idAttr = ` id="${id}"`;
              r[1].t.split(" · ").forEach((v, vi) => IDX.push({ kind: "row", target: id, li: vi, deg, stage: eTab === 1 ? "ep" : "es", text: v.trim() }));
            }
            return `<tr${idAttr}>${r.map(cellHtml).join("")}</tr>`;
          }).join("") + "</tbody></table></div>"; break; }
      case "callout": {
        const inner = b.paras.map((p) => (p.text && /^احترام|^Respect/.test(p.text)) ? `<p class="motto">${md(p.text)}</p>` : `<p>${md(p.text)}</p>`).join("");
        html += `<div class="callout ${b.danger ? "danger" : ""}">${inner}</div>`; break; }
      case "rawtable":
        if (secN === 2) {
          html += '<div class="legend">' + [1, 2, 3, 4, 5].map((k) => `<div style="background:${DEG[k][0]};color:${DEG[k][1]}">${esc(lang === "ar" ? ["","الدرجة الأولى","الدرجة الثانية","الدرجة الثالثة","الدرجة الرابعة","الدرجة الخامسة"][k] : "Level " + k)}<small class="num">${esc(L.deduction)}: ${DEDUCT[k]}</small></div>`).join("") + "</div>";
        } else {
          html += '<div class="form">' + L.form.map((h) => `<div class="h">${esc(h)}</div>`).join("") + L.formRows.map((r) => `<div class="l">${esc(r)}</div><div></div><div></div>`).join("") + "</div>";
        }
        break;
      case "img":
        html += `<figure class="poster"><img src="${A.steps}" alt="${esc(L.poster)}" width="1024" height="1536" loading="lazy"></figure>`; break;
      case "flow": html += flowHtml(L.flow); break;
      case "degree": {
        degN++;
        const [fill, ink] = DEG[b.deg];
        const id = `deg-${degN}`;
        const stageKey = { 8: "p", 9: "s", 10: "staff" }[secN] || "p";
        b.violations.forEach((v, vi) => IDX.push({ kind: "deg", target: id, li: vi, deg: b.deg, stage: stageKey, text: v }));
        html += `<details class="deg" id="${id}"><summary><span class="lvl" style="background:${fill};color:${ink}">${esc(lang === "ar" ? ["","الدرجة الأولى","الدرجة الثانية","الدرجة الثالثة","الدرجة الرابعة","الدرجة الخامسة"][b.deg] : "Level " + b.deg)}</span>` +
          `<span class="deg-meta">${esc(b.stageLabel)} · ${esc(L.deduction)}: <span class="num">${esc(b.deduction)}</span></span><span class="deg-count">${esc(L.count(b.violations.length))}</span></summary>` +
          `<div class="deg-body"><div class="vio"><h4>${esc(L.violations)}</h4><ol class="vlist">${b.violations.map((v) => `<li data-t="${esc(v)}">${md(v)}</li>`).join("")}</ol></div>` +
          `<div class="procs"><h4>${esc(L.procedures)}</h4>` +
          b.procs.map((p) => `<div class="proc"><div class="when">${esc(p.label)}</div><div><ul>${p.items.map((i) => `<li>${md(i)}</li>`).join("")}</ul>` +

  if (f) { filter = f.dataset.filter; try { localStorage.setItem("nahda-guide-filter", filter); } catch (er) {} renderFilters(); runSearch(!!document.getElementById("q").value.trim()); return; }
  const s = e.target.closest("[data-sec]");
  if (s) { document.getElementById("sec-" + s.dataset.sec).scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if (!e.target.closest(".tools")) { document.getElementById("results").hidden = true; document.getElementById("q").setAttribute("aria-expanded", "false"); }
});
const qEl = document.getElementById("q");
qEl.addEventListener("input", () => runSearch());
qEl.addEventListener("focus", () => runSearch());
qEl.addEventListener("keydown", (e) => {
  const box = document.getElementById("results");
  if (e.key === "ArrowDown") { e.preventDefault(); if (box.hidden) runSearch(); setActive(active + 1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); setActive(active - 1); }
  else if (e.key === "Enter") { e.preventDefault(); const h = shown[active >= 0 ? active : 0]; if (h) { goTo(h); qEl.blur(); } }
  else if (e.key === "Escape") { if (!box.hidden) { box.hidden = true; qEl.setAttribute("aria-expanded", "false"); } else { qEl.value = ""; runSearch(false); } }
});

function setLang(l) { lang = l; try { localStorage.setItem("nahda-guide-lang", l); } catch (e) {} render(); }
document.getElementById("btn-ar").addEventListener("click", () => setLang("ar"));
document.getElementById("btn-en").addEventListener("click", () => setLang("en"));

// highlight current section in the rail
const io = "IntersectionObserver" in window ? new IntersectionObserver((ents) => {
  ents.forEach((en) => { if (en.isIntersecting) { const n = en.target.id.split("-")[1];
    document.querySelectorAll("#rail button").forEach((b) => b.classList.toggle("on", b.dataset.sec === n)); } });
}, { rootMargin: "-30% 0px -60% 0px" }) : null;
const observe = () => { if (io) { io.disconnect(); document.querySelectorAll("section.sec").forEach((s) => io.observe(s)); } };

document.getElementById("logo").src = A.logoW;
document.getElementById("logo-foot").src = A.logoW;
try { const saved = localStorage.getItem("nahda-guide-lang"); if (saved === "en" || saved === "ar") lang = saved; } catch (e) {}
if (location.hash === "#en") lang = "en";
render(); observe();
const _render = render; render = function () { _render(); observe(); };
</script>
